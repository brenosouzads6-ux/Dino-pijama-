name: Publicar APK atualizado

on:
  push:
    paths:
      - "DinoPijama-atualizado.apk"
      - ".github/workflows/apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publicar-apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verificar APK
        run: |
          test -s DinoPijama-atualizado.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: dino-pijama-apk
          path: DinoPijama-atualizado.apk
