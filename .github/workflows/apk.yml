name: Gerar APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK
        shell: bash
        run: |
          if [ -f "dino-apk/settings.gradle" ]; then
            cd dino-apk
          elif [ -f "settings.gradle" ]; then
            :
          else
            echo "ERRO: settings.gradle não encontrado. Envie os arquivos extraídos do projeto Android para o repositório."
            exit 1
          fi
          gradle --no-daemon assembleDebug --stacktrace

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: dino-pijama-apk
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
          if-no-files-found: error
