name: Gerar APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - name: Gerar APK
        run: |
          unzip -q DinoPijamaAndroid-Projeto.zip -d proj
          D=$(dirname "$(find proj -name settings.gradle | head -n1)")
          cd "$D"
          gradle assembleDebug
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/out/"
      - uses: actions/upload-artifact@v4
        with:
          name: dino-pijama-apk
          path: out/app-debug.apk
